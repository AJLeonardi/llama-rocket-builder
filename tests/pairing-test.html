<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pairing test</title>
  <style>body { font: 14px system-ui; background: #111; color: #eee; } iframe { width: 480px; height: 300px; border: 1px solid #555; }</style>
</head>
<body>
  <!-- Dev tool: runs two copies of the game and swaps their QR codes in code (like two devices scanning each other).
       Serve the repo over http and open /tests/pairing-test.html. Needs a browser that allows WebRTC. -->
  <iframe id="a" src="../index.html"></iframe>
  <iframe id="b" src="../index.html"></iframe>
  <pre id="out">running...</pre>
  <script>
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const loaded = f => new Promise(r => f.addEventListener('load', r));
    (async () => {
      const out = document.getElementById('out'), log = [];
      try {
        const fa = document.getElementById('a'), fb = document.getElementById('b');
        await Promise.all([loaded(fa), loaded(fb)]);
        const A = { Net: fa.contentWindow.eval('Net') }, B = { Net: fb.contentWindow.eval('Net') };  // top-level const isn't on window
        const [codeA, codeB] = await Promise.all([A.Net.prepare(), B.Net.prepare()]);
        log.push(`code sizes ${codeA.length}/${codeB.length}`);
        // both "cameras" see the other screen at the same time
        const [ansA, ansB] = await Promise.all([A.Net.handleCode(codeB), B.Net.handleCode(codeA)]);
        const guest = ansA ? 'A' : 'B';
        log.push(`guest is ${guest}`);
        // the host's camera now sees the guest's answer (and its own reflection should be ignored)
        if (ansA) await B.Net.handleCode(ansA); else await A.Net.handleCode(ansB);
        await (ansA ? A : B).Net.handleCode(ansA || ansB);  // the guest sees its own answer reflected: ignored
        for (let i = 0; i < 40 && !(A.Net.connected && B.Net.connected); i++) await wait(200);
        log.push(`connected A=${A.Net.connected} (${A.Net.role}) B=${B.Net.connected} (${B.Net.role})`);
        await wait(1800);
        log.push(`seeds match=${A.Net.seed === B.Net.seed}`);
        log.push(`A sees B in "${A.Net.friend && A.Net.friend.scene}", B sees A in "${B.Net.friend && B.Net.friend.scene}"`);
        log.push(A.Net.connected && B.Net.connected && A.Net.seed === B.Net.seed ? 'PASS' : 'FAIL');
      } catch (e) { log.push('ERROR ' + e.message); }
      out.textContent = log.join('\n');
      document.title = 'DONE';
    })();
  </script>
</body>
</html>
