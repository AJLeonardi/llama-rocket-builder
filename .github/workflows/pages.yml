name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the build number = number of commits

      - name: Stamp build number
        run: |
          BUILD=$(git rev-list --count HEAD)
          echo "const BUILD = '$BUILD';" > js/version.js
          echo "{\"build\": \"$BUILD\"}" > version.json
          # a new cache name makes phones pick up the new files
          sed -i "s/llama-rocket-v1/llama-rocket-b$BUILD/" sw.js
          echo "Build $BUILD"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
